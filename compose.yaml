services:
  postgres:
    image: postgres:16
    container_name: water-reports-db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: